[tool.poetry]
name = "python-mcp-template"
version = "0.0.1"
description = "Reusable Python MCP server template — Clean Architecture"
authors = ["surajkadam98 <surajkadam.dev@gmail.com>"]
readme = "README.md"
packages = [
    { include = "application", from = "src" },
    { include = "domain", from = "src" },
    { include = "infrastructure", from = "src" },
    { include = "libraries", from = "src" },
    { include = "main.py", from = "src" },
    { include = "container.py", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
mcp = ">=2.0.0"
pytest = { version = ">=8.0.0", optional = true }
pytest-asyncio = { version = ">=0.24.0", optional = true }

[tool.poetry.extras]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
